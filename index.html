<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังสินค้าอัจฉริยะ – แผนผังแอนิเมชัน</title>
<style>
:root{color-scheme:dark;--bg:#050b18;--panel:rgba(8,20,40,.82);--line:#1fb6ff;--txt:#e8f4ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#view{position:absolute;inset:0;touch-action:none;cursor:zoom-in;overflow:hidden;user-select:none}
#view.out{cursor:zoom-out}#view.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage.ease{transition:transform .55s cubic-bezier(.22,.8,.25,1)}
#stage img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ring{fill:none;stroke:#5fe0ff;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
.ring.b{animation-delay:1.1s}
@keyframes ping{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.6);opacity:0}}
.flow{fill:none;stroke:#5fe0ff;stroke-width:3;stroke-dasharray:10 14;animation:dash 1.2s linear infinite;opacity:.8}
@keyframes dash{to{stroke-dashoffset:-48}}
.scan{fill:#5fe0ff;opacity:.35;animation:scan 2.4s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(54px)}}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.15}50%{opacity:.55}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bar{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;border:1px solid rgba(31,182,255,.55);border-radius:14px;background:var(--panel);backdrop-filter:blur(8px);z-index:5}
.bar button{width:44px;height:44px;border-radius:10px;border:0;background:rgba(31,182,255,.14);color:var(--txt);font:600 22px/1 system-ui;cursor:pointer}
.bar button:hover{background:rgba(31,182,255,.32)}
.bar button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar output{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.hint{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid rgba(31,182,255,.35);font-size:14px;z-index:5;transition:opacity .6s}
.card{position:absolute;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100% - 32px));padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid rgba(31,182,255,.6);backdrop-filter:blur(10px);z-index:5;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .4s,transform .4s;box-shadow:0 0 28px rgba(31,182,255,.25)}
.card.on{opacity:1;transform:none;pointer-events:auto}
.card{max-height:48vh;overflow:auto;width:min(380px,calc(100% - 32px))}
.card .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border:0;border-radius:8px;background:rgba(31,182,255,.16);color:var(--txt);font-size:15px;cursor:pointer}
.card h2{padding-right:34px}
.card ul{margin:10px 0 0;padding-left:20px;font-size:14px;line-height:1.6;color:#c9e3f7}
.card .nv{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:#9fc7e6}
.card .nv button{border:0;border-radius:8px;padding:8px 12px;background:rgba(31,182,255,.16);color:var(--txt);font-size:14px;cursor:pointer}
.card button:focus-visible{outline:2px solid #fff}
.card h2{margin:0 0 6px;font-size:18px}.card p{margin:0;font-size:15px;line-height:1.55;color:#c9e3f7}
.card .kpi{margin-top:10px;display:inline-block;padding:4px 10px;border-radius:8px;background:rgba(31,182,255,.16);font-size:14px;font-variant-numeric:tabular-nums}
.stats{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:5}
.stats div{padding:6px 12px;border-radius:10px;background:var(--panel);border:1px solid rgba(31,182,255,.35);text-align:center;font-size:12px;color:#9fc7e6}
.stats b{display:block;font-size:20px;color:#7dffb0;font-variant-numeric:tabular-nums}
.bar button.act{background:#1fb6ff;color:#041020}
@media (max-width:600px){.stats{top:calc(66px + env(safe-area-inset-top,0px));right:auto;left:16px}.stats b{font-size:16px}.hint{max-width:calc(100% - 32px)}}
@media (prefers-reduced-motion:reduce){.ring,.flow,.scan,.glow,.bob{animation:none}#stage.ease{transition:none}}
</style>
</head>

var INFO=[['ระบบบริหารคลังสินค้า (WMS)','ศูนย์สมองของคลัง ติดตามสต๊อก สั่งงานหยิบ-แพ็ก และดูสถานะทุกออเดอร์แบบเรียลไทม์','ความแม่นยำสต๊อก 99.8%'],['พื้นที่จัดเก็บสินค้า','ชั้นวางพาเลทหลายชั้น แบ่งโซนตามรหัสสินค้า ช่วยหยิบได้เร็วและใช้พื้นที่คุ้มค่า','ใช้พื้นที่จัดเก็บ 87%'],['รถยกสินค้า','ย้ายพาเลทระหว่างประตูรับสินค้ากับชั้นวางตามคำสั่งงานจาก WMS','ย้ายเฉลี่ย 24 พาเลท/ชม.'],['ประตูรับ-ส่งสินค้า','รถบรรทุกจอดเทียบท่าเพื่อขนถ่ายสินค้าเข้าและออก ลดเวลารอคิวด้วยการจองช่วงเวลา','เวลาขนถ่ายเฉลี่ย 35 นาที'],['สายพานลำเลียง','ส่งกล่องจากโซนหยิบไปยังจุดแพ็คโดยอัตโนมัติ ลดการเดินและการยกของด้วยแรงคน','ลำเลียง 1,200 กล่อง/ชม.'],['จุดแพ็คสินค้า','ตรวจนับ สแกน และบรรจุกล่องตามออเดอร์ก่อนส่งต่อไปยังประตูขนส่ง','แพ็กเสร็จ 8 วินาที/ออเดอร์']];
var card=document.getElementById('card'),cur=-1;
var LAB=[[203,63,522,148,0],[761,40,1017,126,1],[1213,113,1451,203,2],[1350,398,1627,486,3],[180,430,451,513,4],[531,761,775,845,5]];
function hit(ix,iy){for(var i=0;i<HOT.length;i++){if(Math.hypot(ix-HOT[i][0],iy-HOT[i][1])<45)return i}for(var j=0;j<LAB.length;j++){var l=LAB[j];if(ix>=l[0]&&ix<=l[2]&&iy>=l[1]&&iy<=l[3])return l[4]}return -1}
var DET=[['รับคำสั่งซื้อและกระจายงานให้พนักงานและรถยก','อัปเดตสต๊อกทันทีเมื่อมีการรับ-หยิบ-ส่งสินค้า','แจ้งเตือนเมื่อสินค้าใกล้หมดหรือออเดอร์ล่าช้า'],['จัดเรียงตามรหัสสินค้าและความถี่ที่ถูกหยิบ','ชั้นวางสูงหลายระดับ ใช้พื้นที่แนวดิ่งเต็มที่','มีป้ายตำแหน่งให้สแกนเช็กได้ทุกช่อง'],['รับงานย้ายพาเลทจากหน้าจอในรถ','นำสินค้าจากประตูรับไปเก็บบนชั้น','ยกพาเลทลงมาส่งโซนหยิบเมื่อมีออเดอร์'],['จอดเทียบท่าตามคิวที่จองไว้ล่วงหน้า','ตรวจนับจำนวนและสภาพสินค้าก่อนรับเข้า','ขึ้นสินค้าที่แพ็กเสร็จแล้วส่งไปยังลูกค้า'],['ลำเลียงกล่องจากโซนหยิบไปจุดแพ็กอัตโนมัติ','ลดระยะเดินและความเสี่ยงจากการยกของ','ปลายสายพานมีจุดสแกนยืนยันกล่อง'],['สแกนบาร์โค้ดเทียบกับออเดอร์','ห่อ ใส่กล่อง และติดป้ายที่อยู่จัดส่ง','ส่งต่อไปประตูขนส่งตามรอบรถ']];
function go(i){cur=i;focus(HOT[i][0],HOT[i][1],3);var d=INFO[i];card.innerHTML='<button class="x" aria-label="ปิด">✕</button><h2>'+d[0]+'</h2><p>'+d[1]+'</p><ul><li>'+DET[i].join('</li><li>')+'</li></ul><span class="kpi">'+d[2]+'</span><div class="nv"><button data-n="-1">‹ ก่อนหน้า</button><span>'+(i+1)+' / 6</span><button data-n="1">ถัดไป ›</button></div>';card.classList.add('on');hint.style.opacity=0}
card.onclick=function(e){var t=e.target.closest('button');if(!t)return;stopTour();if(t.classList.contains('x'))reset();else go((cur+Number(t.dataset.n)+6)%6)};
var TOUR=[3,1,2,4,5,0],ti=0,tt=null,tb=document.getElementById('tour');
function stopTour(){if(tt){clearInterval(tt);tt=null}tb.classList.remove('act');tb.textContent='▶ ทัวร์'}
tb.onclick=function(){if(tt){stopTour();return}tb.classList.add('act');tb.textContent='■ หยุด';ti=0;go(TOUR[0]);tt=setInterval(function(){ti=(ti+1)%TOUR.length;go(TOUR[ti])},5000)};
view.addEventListener('pointerdown',stopTour);
document.addEventListener('keydown',function(e){if(e.key=='Escape')reset();if(e.key=='+'||e.key=='=')zoomAt(cw/2,ch/2,s*1.4,true);if(e.key=='-')zoomAt(cw/2,ch/2,s/1.4,true);if(e.key=='ArrowRight')go((cur+1)%6);if(e.key=='ArrowLeft')go((cur+5)%6)});
function reset(){stopTour();card.classList.remove('on');cur=-1;stage.classList.add('ease');s=1;clamp();apply()}
document.getElementById('zi').onclick=function(){zoomAt(cw/2,ch/2,s*1.5,true)};
document.getElementById('zo').onclick=function(){zoomAt(cw/2,ch/2,s/1.5,true)};
document.getElementById('rs').onclick=reset;
view.addEventListener('wheel',function(e){e.preventDefault();var r=view.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,s*Math.exp(-e.deltaY*0.0015),false)},{passive:false});
var ptrs={},moved=0,start=null,pd=0;
view.addEventListener('pointerdown',function(e){view.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};start={x:e.clientX,y:e.clientY};moved=0;stage.classList.remove('ease');var k=Object.keys(ptrs);if(k.length==2){var a=ptrs[k[0]],b=ptrs[k[1]];pd=Math.hypot(a.x-b.x,a.y-b.y)}});
view.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var k=Object.keys(ptrs);
 if(k.length==2){var a=ptrs[k[0]],b=ptrs[k[1]];ptrs[e.pointerId]={x:e.clientX,y:e.clientY};a=ptrs[k[0]];b=ptrs[k[1]];var d=Math.hypot(a.x-b.x,a.y-b.y),r=view.getBoundingClientRect();if(pd)zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,s*d/pd,false);pd=d;moved=99;return}
 var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(moved>6&&s>1){x+=dx;y+=dy;clamp();apply();view.classList.add('drag')}});
function up(e){var had=ptrs[e.pointerId];delete ptrs[e.pointerId];view.classList.remove('drag');
 if(had&&moved<=6&&Object.keys(ptrs).length==0&&e.type=='pointerup')tap(e)}
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
function tap(e){hint.style.opacity=0;var r=view.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,k=W/IW;
 var ix=(px-x)/(s*k),iy=(py-y)/(s*k);
 var hi=hit(ix,iy);if(hi>=0){go(hi);return}
 if(s<1.4)zoomAt(px,py,2.6,true);else reset()}
var st=document.getElementById('stats'),n1=1184,n2=38,n3=4210;
function drawStats(){st.innerHTML='<div><b>'+n1.toLocaleString('th-TH')+'</b>ออเดอร์วันนี้</div><div><b>'+n2+'</b>กล่อง/นาที</div><div><b>'+n3.toLocaleString('th-TH')+'</b>พาเลทในคลัง</div>'}
drawStats();setInterval(function(){n1+=Math.random()<.6?1:0;n2=34+Math.floor(Math.random()*9);if(Math.random()<.3)n3+=Math.random()<.5?1:-1;drawStats()},1500);
view.addEventListener('pointermove',function(e){if(Object.keys(ptrs).length)return;var r=view.getBoundingClientRect(),k=W/IW;view.style.cursor=hit((e.clientX-r.left-x)/(s*k),(e.clientY-r.top-y)/(s*k))>=0?'pointer':''});
window.addEventListener('resize',fit);fit();
setTimeout(function(){hint.style.opacity=.0},9000);
})();
</script>
